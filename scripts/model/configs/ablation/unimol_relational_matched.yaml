# Same training settings as rich_input_only.yaml; replace Morgan with UniMol.
stage: posttrain
molecular_target: unimol
fingerprint_objective: similarity
unimol_sidecar_dir: datasets/experimental/unimol2_rich
balanced_fp_pairs: true
fp_sim_bin_size: 0.05
use_rich_input: true
use_annotation_loss: false
lambda_fp: 0.1
lambda_annotation: 0.2  # Inactive, as in rich_input_only.yaml.
warmup_steps: 500
plateau_patience: 100
early_stopping_patience: 100
max_steps: 15000
